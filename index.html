<script>'use strict';
const KEY='rom-sprint-v1';
const blank=()=>({mode:'full',answers:{},draft:'',rubric:{},sourceDone:false,model:false,last:'start'});
let state=blank(),storageOK=true;

const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chronologyURL='https://www.uni-trier.de/fileadmin/fb5/prof/ZIV008/RRG10-11/RRG3.pdf';
const museumURL='https://museicapitolini.comune.roma.it/assetdet/3335';
const questions=[
 {id:'g1',topic:'gruendung',q:'Was bedeutet die Jahreszahl 753 v. Chr.?',options:['In diesem Jahr wurde die Wölfin aus Bronze gegossen.','Sie ist das traditionelle Gründungsdatum der Sage.','Archäologen haben die Stadtgründung an diesem Tag bewiesen.'],correct:1,explain:'753 v. Chr. gehört zur römischen Gründungsüberlieferung. Die tatsächliche Stadt entstand über längere Zeit aus Siedlungen am Tiber.'},
 {id:'g2',topic:'gruendung',q:'Wozu diente der Gründungsmythos vor allem?',options:['Er stiftete Zusammengehörigkeit und gab Rom eine besondere, mit Göttern verbundene Herkunft.','Er dokumentierte die Gründung wie ein überprüfbarer Augenzeugenbericht.','Er erklärte ausschließlich den Bau der Wasserleitungen.'],correct:0,explain:'Die gemeinsame Herkunft stärkte die Identität. Die Verbindung zu Mars und Venus konnte Ansehen und Herrschaftsansprüche begründen. Eine Sage ist deshalb für das Selbstbild wichtig, aber kein Tatsachenbeweis.'},
 {id:'g3',topic:'gruendung',q:'Welche Erklärung beschreibt Roms Entwicklung historisch?',options:['Rom entstand ohne ältere Siedlungen an einem einzigen Tag.','Rom entstand erst durch die Kaiser.','Siedlungen am verkehrsgünstigen Tiber wuchsen zusammen; Etrusker förderten den städtischen Ausbau.'],correct:2,explain:'Flussübergang, Handelswege und fruchtbares Umland begünstigten die Siedlung. Unter etruskischem Einfluss entstanden städtische Anlagen wie das Forum.'},
 {id:'f1',topic:'familie',q:'Welche Aussage trifft die römische familia am besten?',options:['Sie bestand nur aus Eltern und minderjährigen Kindern.','Sie war ein hierarchischer Hausverband, zu dem auch versklavte Menschen gehörten; Klienten waren an ihn gebunden.','Alle Angehörigen hatten dieselben Rechte.'],correct:1,explain:'Die familia war zugleich eine wirtschaftliche, soziale und religiöse Einheit unter dem pater familias. Klienten waren freie Schutzbefohlene und keine Sklaven.'},
 {id:'f2',topic:'familie',q:'Was kennzeichnet das Verhältnis zwischen Patron und Klient?',options:['Schutz und Unterstützung durch den Patron gegen Treue und Dienste des Klienten.','Der Klient gehörte als Eigentum dem Patron.','Beide waren gewählte Kollegen mit gleichen Befugnissen.'],correct:0,explain:'Das Klientelwesen verband freie Menschen in einem ungleichen, gegenseitigen Treueverhältnis. Ein Patron konnte etwa vor Gericht helfen; ein Klient unterstützte ihn gesellschaftlich oder politisch.'},
 {id:'s1',topic:'staende',q:'Welche Zuordnung ist richtig?',options:['450 v. Chr.: Lex Hortensia – 287 v. Chr.: Zwölftafelgesetz.','445 v. Chr.: alle Ämter offen – 367 v. Chr.: Beginn der Republik.','Um 450 v. Chr.: Zwölftafelgesetz – 287 v. Chr.: Lex Hortensia.'],correct:2,explain:'Um 450 v. Chr. wurde Recht schriftlich festgehalten. 287 v. Chr. erhielten Beschlüsse der Plebejerversammlung verbindliche Gesetzeskraft für alle römischen Bürger. Zwei Zeitstrahlen in deiner ZIP vertauschen diese Punkte.'},
 {id:'s2',topic:'staende',q:'Warum konnten die Plebejer Zugeständnisse erzwingen?',options:['Sie stellten sofort sämtliche Senatoren.','Rom war auf ihre Arbeit und ihren Militärdienst angewiesen; Auszüge und Verweigerung erzeugten Druck.','Sie waren die einzigen römischen Bürger mit Landbesitz.'],correct:1,explain:'Die Plebejer waren wirtschaftlich und militärisch unentbehrlich. Gemeinsam konnten sie diese Abhängigkeit als Druckmittel nutzen, um Schutz und politische Rechte zu gewinnen.'},
 {id:'s3',topic:'staende',q:'War Rom am Ende der Ständekämpfe eine Demokratie im heutigen Sinn?',options:['Nein. Rechte wurden erweitert, aber eine Elite blieb einflussreich; Frauen und Sklaven waren politisch ausgeschlossen.','Ja. Alle Einwohner besaßen dasselbe Wahlrecht.','Nein. Die Plebejer erhielten überhaupt keine neuen Rechte.'],correct:0,explain:'Patrizische und führende plebejische Familien bildeten die Nobilität. Rechtliche Annäherung der Stände beseitigte weder soziale Ungleichheit noch politische Ausschlüsse.'},
 {id:'a1',topic:'aemter',q:'Welche Reihenfolge entspricht der Ämterleiter in euren Materialien?',options:['Konsul → Quästor → Prätor → Ädil.','Quästor → Ädil → Prätor → Konsul.','Prätor → Konsul → Quästor → Ädil.'],correct:1,explain:'Merke: Kasse → Stadt → Recht → Staat. Das Ädilenamt war allerdings kein durchgehend zwingender Schritt. Die Zensur folgte als besonderes Ehrenamt oft nach dem Konsulat.'},
 {id:'a2',topic:'aemter',q:'Was sollen Annuität und Kollegialität verhindern?',options:['Die Teilnahme der Bürger an Wahlen.','Dass mehrere Personen politische Erfahrung sammeln.','Dass ein Einzelner dauerhaft zu viel Macht ansammelt.'],correct:2,explain:'Annuität begrenzt die reguläre Amtszeit meist auf ein Jahr. Kollegialität verteilt das Amt auf mehrere Inhaber, die sich kontrollieren und teilweise gegenseitig blockieren können.'},
 {id:'a3',topic:'aemter',q:'Wer schützt die Plebejer durch ein Vetorecht?',options:['Der Volkstribun.','Der Quästor.','Der Zensor.'],correct:0,explain:'Der Volkstribun vertritt die Plebs und kann gegen Maßnahmen anderer Amtsträger einschreiten. Quästoren kümmern sich vor allem um Finanzen; Zensoren um Bürgerlisten, Vermögenseinstufung und Sittenaufsicht.'},
 {id:'b1',topic:'bild',q:'Welcher Satz ist zunächst eine reine Bildbeschreibung?',options:['Die Wölfin beweist den göttlichen Ursprung Roms.','Unter dem Bauch der stehenden Wölfin sind zwei kleine menschliche Figuren zu sehen.','Der Künstler wollte sicher alle Nachbarvölker einschüchtern.'],correct:1,explain:'Eine Beschreibung benennt Sichtbares. Die Identifikation als Romulus und Remus, Symbolik und mögliche Absichten gehören zur Einordnung und Deutung. Absichten müssen begründet werden.'},
 {id:'b2',topic:'bild',q:'Welche quellenkritische Aussage ist überzeugend?',options:['Die Statue beweist, dass eine Wölfin die Zwillinge tatsächlich ernährt hat.','Jede Darstellung der Sage entstand genau 753 v. Chr.','Das Motiv zeigt die Bedeutung des Mythos; es belegt nicht das tatsächliche Gründungsgeschehen.'],correct:2,explain:'Darstellungen können zeigen, wie man sich erinnern und darstellen wollte. Die Entstehungszeit eines Bildes ist von der erzählten Zeit zu unterscheiden; bei dieser Gruppe kamen die Zwillinge erst später hinzu.'}
];
const lessons=[
 {id:'gruendung',name:'Roms Gründung',sub:'Sage und Geschichte auseinanderhalten',time:4,express:2,title:'Eine Stadt. Zwei Geschichten.',intro:'Dein Ziel: Du kannst die Gründungssage erzählen und erklären, warum sie keine historische Tatsachenschilderung ist.',bullets:[
 '<b>Die Sage:</b> Romulus und Remus, Söhne von Mars und Rea Silvia, werden auf dem Tiber ausgesetzt. Eine Wölfin säugt sie; ein Hirte zieht sie auf. Im späteren Streit tötet Romulus Remus und wird der Sage nach Roms Gründer.',
 '<b>753 v. Chr.:</b> traditionelles Gründungsdatum – „Sieben-fünf-drei“. Als <em>Sagendatum</em> kennzeichnen, nicht als bewiesenen Gründungstag.',
 '<b>Die Siedlungsgeschichte:</b> Seit etwa 1000 v. Chr. leben Hirten und Bauern am Tiber. Im 7./6. Jahrhundert v. Chr. fördern Etrusker den Ausbau zur Stadt. Günstig sind Flussübergang, Handelswege und fruchtbares Umland.',
 '<b>Die Funktion:</b> Eine gemeinsame Herkunftserzählung stiftet Identität. Götter und gerettete Gründer verleihen Rom besonderes Ansehen und können Herrschaft legitimieren.'
 ],memory:'753 = Sage. Stadtwerdung = langer Prozess. Mythos = gemeinsame Identität.',extra:'<div class="compare"><div class="mini"><h3>Äneas als Verbindung</h3><p>Äneas flieht der Sage nach aus Troja. Seine Mutter ist Venus. Seine Nachkommen verbinden die Trojanersage mit Romulus und Remus: Rom erhält eine ehrwürdige und göttliche Herkunft.</p></div><div class="mini"><h3>Zeitlich einordnen</h3><p>Königszeit → Republik (traditionell 510/509 v. Chr.) → Kaiserzeit. Die Gründungssage liegt vor der Republik; die Ständekämpfe gehören in die Republik.</p></div></div>',source:'Römisches Reich-3.jpg bis -5.jpg: Schulbuchseiten „Die Anfänge Roms“ und Gegenüberstellung von Siedlungsgeschichte und Sage.'},
 {id:'familie',name:'Die römische Familie',sub:'Hausverband, Macht und Abhängigkeit',time:4,express:1,title:'Mehr als Eltern und Kinder.',intro:'Dein Ziel: Du erklärst die familia als hierarchischen Hausverband und unterscheidest Familienangehörige, Sklaven und Klienten.',bullets:[
 '<b>Familia:</b> größer als unsere heutige Kleinfamilie. Zum Hausverband gehören mehrere Generationen und versklavte Menschen; Freigelassene und Klienten sind ihm verbunden.',
 '<b>Pater familias:</b> männliches Oberhaupt mit weitreichender Hausgewalt. Im traditionellen Modell bestimmt er über Besitz, Erziehung und Eheschließungen und trägt Verantwortung für Schutz, Versorgung und Hauskult.',
 '<b>Ungleiche Stellung:</b> Frauen, Kinder und Sklaven stehen nicht auf derselben rechtlichen Stufe wie das Oberhaupt. Die konkrete Stellung von Frauen und die väterliche Macht verändern sich über die Jahrhunderte.',
 '<b>Patron und Klient:</b> Schutz und Hilfe gegen Treue und Unterstützung. Klienten sind freie Menschen in einem Abhängigkeitsverhältnis; versklavte Menschen sind unfrei.'
 ],memory:'Familia = Hausverband. Pater familias = Oberhaupt. Klient ≠ Sklave.',extra:'<div class="compare"><div class="mini"><h3>Religion ordnet den Alltag</h3><p>Der pater familias leitet den Hauskult: Hausgötter und Ahnen werden verehrt. Religion stützt die Ordnung von Familie und Staat.</p></div><div class="mini"><h3>So formulierst du genauer</h3><p>„Das traditionelle Modell ist patriarchal geprägt.“ Vermeide pauschale Aussagen wie „Frauen hatten zu allen Zeiten überhaupt keine Rechte“.</p></div></div>',source:'Römische Familie/Bildquellenanalyse-4.jpg bis -7.jpg: Schaubild, Schulbuchtext und Notizen zur familia; ergänzend Ständekämpfe/IMG_0384.jpg zum Klientelwesen.'},
 {id:'staende',name:'Die Ständekämpfe',sub:'Ursachen, Erfolge und Grenzen',time:5,express:2,title:'Wer bekommt eine Stimme?',intro:'Dein Ziel: Du erklärst den Konflikt zwischen Patriziern und Plebejern als Ursache → Druckmittel → Reformen → begrenzte Gleichstellung.',bullets:[
 '<b>Ausgangslage:</b> Patrizier sind Angehörige alter privilegierter Adelsfamilien. Plebejer sind die übrigen freien Bürger – darunter Bauern, Handwerker und auch Wohlhabende. Plebejer sind keine Sklaven.',
 '<b>Konflikt:</b> Ungleicher Zugang zu hohen Ämtern und Recht, Schulden und Landfragen. Die Plebejer fordern Schutz und politische Mitsprache.',
 '<b>Druckmittel:</b> Auszüge, Arbeits- und Wehrdienstverweigerung. Rom braucht ihre Arbeit und seine plebejischen Soldaten.',
 '<b>Ergebnis:</b> Schrittweise mehr Rechte. Führende Plebejer und Patrizier bilden die Nobilität. Die Republik bleibt von einer Elite geprägt; soziale Ungleichheit bleibt bestehen.'
 ],memory:'450 = Recht auf Tafeln. 445 = Heirat. 367/366 = Konsulat. 287 = Lex Hortensia.',extra:'<ul class="timeline"><li><b>494 v. Chr.</b><span>Traditioneller erster Auszug; eigene Interessenvertretung durch Volkstribunen.</span></li><li><b>451/450 v. Chr.</b><span>Zwölftafelgesetz: öffentlich bekanntes, schriftliches Recht begrenzt Willkür.</span></li><li><b>445 v. Chr.</b><span>Eheverbot zwischen Patriziern und Plebejern fällt.</span></li><li><b>367/366 v. Chr.</b><span>Zugang der Plebejer zum Konsulat: Gesetz 367, erster plebejischer Konsul 366.</span></li><li><b>326 v. Chr.</b><span>In euren Materialien: Aufhebung der Schuldknechtschaft.</span></li><li><b>287 v. Chr.</b><span>Lex Hortensia: Beschlüsse der Plebejerversammlung gelten für alle Bürger. Üblicher Endpunkt der Ständekämpfe.</span></li></ul>',source:'Ständekämpfe/IMG_0368.jpg, IMG_0384.jpg und IMG_0182.jpg. Die beiden „Ständekämpfe Zeitstrahl“-Bilder enthalten fehlerhafte Zuordnungen; die unten genannten Korrekturen sind fachlich abgeglichen.'},
 {id:'aemter',name:'Der cursus honorum',sub:'Ämter zuordnen, Machtbegrenzung erklären',time:4,express:2,title:'Die Leiter zur Macht.',intro:'Dein Ziel: Du kennst die wichtigsten Aufgaben und erklärst, wie die Republik die Macht Einzelner begrenzen sollte.',bullets:[
 '<b>Ämterleiter im Unterricht:</b> Quästor → Ädil → Prätor → Konsul. Die Zensur ist ein besonderes Ehrenamt meist ehemaliger Konsuln. Nicht jede Stufe war zu jeder Zeit verpflichtend.',
 '<b>Annuität:</b> reguläre Ämter meist ein Jahr. <b>Kollegialität:</b> mehrere gleichberechtigte Amtsträger, etwa zwei Konsuln, kontrollieren einander.',
 '<b>Cursus honorum:</b> geregelte Ämterlaufbahn mit Reihenfolge, Mindestalter und Abständen. Ehrenamtlichkeit und Kosten begünstigen wohlhabende Kandidaten.',
 '<b>Senat:</b> einflussreicher Rat vor allem ehemaliger Amtsträger. Er prägt Politik und Finanzen; er ist selbst keine Stufe der Ämterlaufbahn.'
 ],memory:'Quästor: Kasse. Ädil: Stadt. Prätor: Recht. Konsul: Staat und Heer.',extra:'<div class="table-wrap"><table><thead><tr><th>Amt</th><th>Kernaufgabe / Besonderheit</th></tr></thead><tbody><tr><td>Quästor</td><td>Verwaltet Staats- und Kriegskassen.</td></tr><tr><td>Ädil</td><td>Märkte, Versorgung, öffentliche Ordnung und Spiele.</td></tr><tr><td>Prätor</td><td>Rechtspflege; kann auch militärische Befehlsgewalt haben.</td></tr><tr><td>Konsul</td><td>Zwei höchste reguläre Amtsträger; leiten Staat und Heer.</td></tr><tr><td>Zensor</td><td>Bürger- und Vermögenslisten, Sittenaufsicht; Wahl alle fünf Jahre, Amtszeit bis zu 18 Monate.</td></tr><tr><td>Volkstribun</td><td>Schutz der Plebs, Vetorecht, persönliche Unverletzlichkeit.</td></tr><tr><td>Diktator</td><td>Außerordentliches Krisenamt; im traditionellen Modell höchstens sechs Monate.</td></tr></tbody></table></div><p class="small">Weitere Begriffe aus euren Materialien: Militärtribun = Offizier; Pontifex maximus = oberster Priester. Für den Sprint haben die Ämter oben Vorrang.</p>',source:'Politische Ämter/IMG_0395.jpg bis IMG_0397-2.jpg; ergänzend Ständekämpfe/IMG_0368.jpg. Bei der Zensur folgt der Sprint der Tabelle IMG_0396.jpg: fünf Jahre Wahlabstand, bis zu 18 Monate Amtsdauer.'},
 {id:'bild',name:'Die Wölfin analysieren',sub:'Dein Klausurtipp: Romulus und Remus',time:6,express:2,title:'Vom Hinschauen zum Deuten.',intro:'Dein Ziel: Du formulierst eine kurze Bildquellenanalyse mit sichtbaren Belegen und einer Aussage über die Grenzen der Quelle. Das Motiv ist ein Tipp, keine gesicherte Klausurvorhersage.',bullets:[
 '<b>1 · Beschreiben:</b> Einleitung mit Quellenart, Motiv, Urheber, Ort und Zeit – soweit angegeben. Dann sichtbare Figuren, Anordnung, Haltung und Größenverhältnisse sachlich benennen.',
 '<b>2 · Einordnen und erklären:</b> Das Motiv mit der Sage von Romulus und Remus verbinden. Entstehungszeit des Objekts und erzählte Zeit unterscheiden. Adressaten und Anlass nur nennen, wenn belegt.',
 '<b>3 · Interpretieren:</b> Deutung an Details begründen: Die nährende Wölfin und die Kinder können Rettung und Fortbestand symbolisieren. Das Motiv erinnert an Roms besonderen Ursprung und stiftet Identität.',
 '<b>Quellenkritik:</b> Die Darstellung belegt die Bedeutung und spätere Nutzung der Sage, aber nicht deren tatsächliches Geschehen. Kein erfundenes Datum und keine unbelegte Künstlerabsicht.'
 ],memory:'Beschreiben → einordnen → deuten. Jede Deutung braucht ein Bilddetail.',extra:'<div class="steps"><div><b>Tradition</b>Bewusst für spätere Betrachter überliefert, etwa eine inszenierte Erinnerung.</div><div><b>Überrest</b>Unabsichtlich erhaltene Spur einer Zeit. Die Einordnung hängt auch von der Fragestellung ab.</div><div><b>Bei der Wölfin</b>Als Erinnerungsbild vermittelt sie bewusst den Gründungsmythos; als Objekt dokumentiert sie auch spätere Ergänzungen und Nutzung.</div></div>',source:'Römische Familie/Bildquellenanalyse-1.jpg: euer Dreischritt. Abbildung: Ausschnitt aus Römisches Reich-3.jpg (Schulbuchfoto, M1). Ergänzende Datierungsprüfung: offizieller Objektkatalog der Kapitolinischen Museen.'}
];

lich drei Sätze: einen zum Sichtbaren, einen zur Bedeutung und einen zur Aussagegrenze. Notiere bei Bedarf Stichwörter.':'Schreibe 6–8 Sätze: Beschreibe die Gruppe, ordne das Motiv ein und deute seine Bedeutung. Beurteile zum Schluss, was die Quelle belegen kann.'}</p><label for="draft">Deine Antwort</label><textarea id="draft" placeholder="Die Abbildung zeigt … Im Vordergrund / unterhalb … Das Motiv verweist auf … Daraus lässt sich … Nicht belegen lässt sich …">${escapeHTML(state.draft)}</textarea><p class="small">Dein Text wird nur hier gespeichert. Vergleiche ihn selbst mit der Musterantwort.</p><button class="secondary" id="model-btn">${state.model?'Musterantwort ausblenden':'Musterantwort & Selbstkontrolle öffnen'}</button><div id="model-area" ${state.model?'':'hidden'}>${modelHTML()}</div></section>`;}
function modelHTML(){return `<div class="model"><b>Eine mögliche Antwort</b><p>Die Abbildung zeigt die Kapitolinische Wölfin mit den später ergänzten Kinderfiguren Romulus und Remus als Bronzegruppe. Die Wölfin steht auf vier Beinen und wendet ihren Kopf nach links; unter ihrem Bauch richten sich zwei kleine Kinder zu ihren Zitzen. Durch ihre Größe und die Anordnung über den Kindern dominiert die Wölfin die Gruppe. Das Motiv verweist auf die römische Gründungssage, in der eine Wölfin die ausgesetzten Zwillinge säugt und rettet. Das Säugen lässt sich deshalb als Bild für Rettung, Versorgung und den Fortbestand der späteren Stadt deuten. Die Erinnerung an diesen besonderen Ursprung kann Zusammengehörigkeit und das Ansehen Roms stärken. Die dargestellte Sagenzeit ist von der Entstehung des Objekts zu trennen: Die Datierung der Wölfin ist umstritten, die Zwillinge kamen erst im späten 15. Jahrhundert hinzu. Die Gruppe zeigt somit die Bedeutung und spätere Nutzung des Mythos, beweist aber weder die Rettung der Zwillinge durch ein Tier noch Roms Gründung im Jahr 753 v. Chr.</p></div><div class="rubric"><h3>Was steckt schon in deiner Antwort?</h3><p class="small">Nur ankreuzen, was du selbst genannt hast. Offene Punkte kommen in deinen Abschlusscheck.</p>${rubricText.map((t,i)=>`<label><input type="checkbox" data-rubric="${i}" ${state.rubric[i]?'checked':''}>${t}</label>`).join('')}<button class="primary" id="source-done">Selbstkontrolle abschließen →</button><p class="finish-message" id="source-message">${state.sourceDone?'Selbstkontrolle gespeichert. Offene Punkte findest du im Abschlusscheck.':''}</p></div>`;}
function lessonHTML(l){const i=lessons.indexOf(l),express=state.mode==='express';return `<div class="lesson-head"><div class="intro-label"><span class="dot"></span>Station 0${i+1} / 05 · ${express?l.express:l.time} ${(express?l.express:l.time)===1?'Minute':'Minuten'}</div><select id="mode" class="mode-select" aria-label="Lernweg"><option value="full" ${express?'':'selected'}>25-Minuten-Sprint</option><option value="express" ${express?'selected':''}>10-Minuten-Express</option></select></div><h1 class="lesson-title">${l.title}</h1><p class="lede">${l.intro}</p><section class="summary-card"><div class="eyebrow">DAS MUSS SITZEN</div><ul>${l.bullets.map(b=>`<li>${b}</li>`).join('')}</ul></section><div class="memory"><span>Dein Merksatz</span>${l.memory}</div>${l.id==='staende'?`<div class="notice"><b>Korrektur zu deinen Zeitstrahlen:</b> Lex Hortensia = 287 v. Chr.; um 450 v. Chr. = Zwölftafelgesetz. 445 betrifft das Heiratsverbot, nicht den Zugang zum Konsulat. <a href="${chronologyURL}" target="_blank" rel="noopener">Fachlicher Abgleich</a></div>`:''}${l.id==='aemter'?'<div class="notice"><b>Nicht verwechseln:</b> Zensoren wurden alle fünf Jahre gewählt, waren aber höchstens 18 Monate im Amt. Die bunte Übersicht in der ZIP verwechselt Wahlabstand und Amtszeit.</div>':''}<details class="detail" ${!express?'open':''}><summary>${l.id==='staende'?'Die sechs Stationen der Ständekämpfe':l.id==='aemter'?'Alle wichtigen Ämter auf einen Blick':'Etwas genauer verstehen'}${express?' · optional':''}</summary><div>${l.extra}</div></details><section class="quiz-area"><p class="eyebrow">JETZT OHNE SPICKEN</p><h2>Kannst du es abrufen?</h2><p class="small">Lies die Frage, entscheide dich und nutze die Rückmeldung. ${express?'Eine Kernfrage für deinen Expressweg.':''}</p>${activeQuestions(l).map(qHTML).join('')}</section>${l.id==='bild'?sourceExercise():''}<div class="source-line"><b>Aus deinen Unterlagen:</b> ${l.source}</div><div class="bottom-nav"><span class="small">${isDone(l)?'✓ Station bearbeitet.':l.id==='bild'?'Beantworte die Fragen und schließe die Selbstkontrolle ab.':'Beantworte die Fragen, damit die Station als bearbeitet zählt.'}</span><a class="primary" href="#${i<4?lessons[i+1].id:'final'}">${i<4?'Nächste Station':'Zum Abschlusscheck'} →</a></div>`;}
function finish(){const qs=activeQuestions(),first=qs.filter(q=>typeof state.answers[q.id]?.first==='boolean'),correctFirst=first.filter(q=>state.answers[q.id].first).length,currentCorrect=qs.filter(isCorrect).length,weak=qs.filter(q=>answered(q)&&!isCorrect(q)),unanswered=qs.filter(q=>!answered(q)),rubricGaps=rubricText.filter((t,i)=>!state.rubric[i]);return `<div class="intro-label"><span class="dot"></span>Dein Abschlusscheck · ${state.mode==='express'?'1 Minute':'2 Minuten'}</div><h1 class="lesson-title">Jetzt weißt du,<br><em>wo du stehst.</em></h1><p class="lede">Ein Lerncheck, keine Notenprognose. Wiederhole zuerst deine offenen Punkte. Erkläre die Antworten anschließend einmal laut in eigenen Worten.</p><div class="result-grid"><div class="result-card"><b>${correctFirst}/${first.length}</b><span>beim ersten Versuch richtig</span></div><div class="result-card"><b>${currentCorrect}/${qs.length}</b><span>aktuell richtig beantwortet</span></div><div class="result-card"><b>${lessons.filter(isDone).length}/5</b><span>Stationen bearbeitet</span></div></div><h2>Deine nächste kleine Wiederholung</h2>${weak.length?weak.map(q=>`<a class="gap-item" href="#${q.topic}"><b>↗ ${lessons.find(l=>l.id===q.topic).name}</b><span>${q.q}</span></a>`).join(''):first.length?'<p class="small">Keine aktuell falsch beantworteten Fragen in diesem Lernweg.</p>':'<p class="small">Starte mit den Fragen. Danach erscheinen hier deine Lernlücken.</p>'}${unanswered.length?`<div class="notice"><b>${unanswered.length} Fragen sind noch offen.</b> ${[...new Set(unanswered.map(q=>q.topic))].map(t=>`<a href="#${t}">${lessons.find(l=>l.id===t).name}</a>`).join(' · ')}</div>`:''}${!state.sourceDone?'<div class="notice">Die Bildübung ist noch offen. <a href="#bild">Jetzt kurz beschreiben, einordnen und deuten →</a></div>':rubricGaps.length?`<div class="summary-card"><h3>Bei der Bildanalyse noch ergänzen</h3><ul>${rubricGaps.map(t=>`<li>${t}</li>`).join('')}</ul><a href="#bild" class="text-button">Zur Musterantwort und Selbstkontrolle</a></div>`:'<div class="memory">✓ Du hast alle sechs Kriterien der Bildanalyse selbst als erfüllt markiert.</div>'}<section class="summary-card"><div class="eyebrow">DIE LETZTEN 60 SEKUNDEN</div><h2>Fünf Sätze für den Kopf.</h2><ol class="express-brief"><li><b>Gründung:</b> 753 v. Chr. ist ein Sagendatum; die Stadt entwickelte sich schrittweise.</li><li><b>Familia:</b> Hierarchischer Hausverband unter dem pater familias; Klient und Sklave unterscheiden.</li><li><b>Ständekämpfe:</b> Politische und soziale Konflikte führten zu mehr Rechten, aber keiner modernen Demokratie.</li><li><b>Ämter:</b> Kasse → Stadt → Recht → Staat; ein Jahr und mehrere Kollegen begrenzen Macht.</li><li><b>Bildquelle:</b> Sichtbares → Kontext → begründete Deutung → Aussagegrenze.</li></ol></section><div class="notice"><b>Wenn „beurteilen“ verlangt wird:</b> Behauptung + Beleg + abgewogenes Urteil. Beispiel: „Die Ständekämpfe erweiterten die Beteiligung, weil Plebejer Zugang zum Konsulat gewannen. Dennoch blieb die Nobilität bestimmend; eine Gleichberechtigung aller Einwohner entstand nicht.“</div><div class="actions"><button class="secondary" id="print-final">Merkblatt drucken</button><a class="primary" href="#bild">Die Wölfin noch einmal →</a></div><p class="footnote">Grundlage: die fünf Themen in deiner ZIP. Andere Motive können in der Prüfung vorkommen; der Dreischritt funktioniert auch bei einer Münze oder einem Familienrelief. Fehlende Angaben offen benennen, nicht ergänzen.</p>`;}
function render(){const page=current();state.last=page;document.getElementById('content').innerHTML=page==='start'?start():page==='final'?finish():lessonHTML(lessons.find(l=>l.id===page));renderNav();save();bind();}
function bind(){document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.start;save();location.hash='gruendung';});const mode=document.getElementById('mode');if(mode)mode.onchange=()=>{state.mode=mode.value;render();};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=questions.find(q=>q.id===b.dataset.q),choice=Number(b.dataset.choice),r=state.answers[q.id];state.answers[q.id]={choice,first:typeof r?.first==='boolean'?r.first:choice===q.correct,tries:(r?.tries||0)+1};save();const article=document.getElementById(q.id),index=activeQuestions(lessons.find(l=>l.id===q.topic)).findIndex(x=>x.id===q.id);article.outerHTML=qHTML(q,index);renderNav();bindQuestion(q.id);const bottom=document.querySelector('.bottom-nav .small');const l=lessons.find(l=>l.id===current());if(bottom&&l&&isDone(l))bottom.textContent='✓ Station bearbeitet.';});document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=()=>{const q=questions.find(q=>q.id===b.dataset.retry);state.answers[q.id].choice=null;save();render();document.getElementById(q.id).scrollIntoView({block:'center'});document.querySelector(`#${q.id} .option`).focus({preventScroll:true});});const draft=document.getElementById('draft');if(draft)draft.oninput=()=>{state.draft=draft.value;state.sourceDone=false;save();renderNav();const m=document.getElementById('source-message');if(m)m.textContent='Antwort geändert. Vergleiche sie erneut und schließe die Selbstkontrolle ab.';};const model=document.getElementById('model-btn');if(model)model.onclick=()=>{state.model=!state.model;save();document.getElementById('model-area').hidden=!state.model;model.textContent=state.model?'Musterantwort ausblenden':'Musterantwort & Selbstkontrolle öffnen';};document.querySelectorAll('[data-rubric]').forEach(c=>c.onchange=()=>{state.rubric[c.dataset.rubric]=c.checked;state.sourceDone=false;save();renderNav();const m=document.getElementById('source-message');if(m)m.textContent='Änderung gespeichert. Schließe die Selbstkontrolle erneut ab.';});const done=document.getElementById('source-done');if(done)done.onclick=()=>{state.sourceDone=true;save();renderNav();document.getElementById('source-message').textContent='Selbstkontrolle gespeichert. Offene Punkte findest du im Abschlusscheck.';const l=lessons.find(l=>l.id==='bild');if(isDone(l))document.querySelector('.bottom-nav .small').textContent='✓ Station bearbeitet.';};const print=document.getElementById('print-final');if(print)print.onclick=()=>window.print();}
function bindQuestion(id){const retry=document.querySelector(`#${id} [data-retry]`);if(retry)retry.onclick=()=>{state.answers[id].choice=null;save();render();document.getElementById(id).scrollIntoView({block:'center'});document.querySelector(`#${id} .option`).focus({preventScroll:true});};}
document.querySelector('.skip').onclick=e=>{e.preventDefault();document.getElementById('content').focus();};
document.getElementById('print-btn').onclick=()=>window.print();
document.getElementById('reset-btn').onclick=()=>document.getElementById('reset-dialog').showModal();document.getElementById('cancel-reset').onclick=()=>document.getElementById('reset-dialog').close();document.getElementById('confirm-reset').onclick=()=>{state=blank();save();document.getElementById('reset-dialog').close();location.hash='start';render();};
document.getElementById('print-sheet').innerHTML=`<h1>Rom · Dein Prüfungs-Merkblatt</h1><p class="small">Nach den fünf Themen deiner Unterrichtsmaterialien. Zum Wiederholen vor der Prüfung.</p>${lessons.map(l=>`<div class="print-section"><h2>${l.name}</h2><p><b>${l.memory}</b></p>${l.bullets.map(b=>`<p>• ${b}</p>`).join('')}</div>`).join('')}<div class="print-section"><h2>Die Daten richtig zuordnen</h2><p>494 v. Chr.: erster Auszug / Volkstribunen. 451/450: Zwölftafelgesetz. 445: Eheverbot fällt. 367/366: Zugang zum Konsulat. 326: Schuldknechtschaft aufgehoben (Unterricht). 287: Lex Hortensia.</p><p>Zensoren: alle fünf Jahre gewählt, bis zu 18 Monate im Amt. Wölfin: Datierung umstritten; Zwillinge Ende des 15. Jahrhunderts ergänzt. 753 v. Chr. ist das Sagendatum.</p><p class="small">Korrekturen abgeglichen mit Universität Trier, „Römische Rechtsgeschichte (3)“, und Musei Capitolini, Objektkatalog „Lupa Capitolina (scu 1181)“.</p></div>`;
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);document.getElementById('content').focus({preventScroll:true});});
if(!location.hash&&state.last!=='start')location.hash=state.last;render();
</script>
</body></html>
